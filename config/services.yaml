# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(DEFAULT_URI): 'https://localhost'
services:
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    _instanceof:
        Symfony\Component\Console\Command\Command:
            tags: ["command"]

    Atoolo\CrawlerIndexer\:
        resource: "../src/"
        # These are assembled per run by CrawlerPipelineFactory around an
        # immutable PipelineConfig, so they are not container services.
        exclude:
            - "../src/Config/PipelineConfig.php"
            - "../src/Config/PipelineConfigHelper.php"
            - "../src/Ports/RequestExecutor.php"
            - "../src/Pipeline/CrawlerPipeline.php"
            - "../src/Pipeline/Collector"
            - "../src/Pipeline/Fetcher"
            - "../src/Pipeline/Parser"
            - "../src/Pipeline/Processor"
            - "../src/Pipeline/Indexer"

    # Run in Development
    Atoolo\CrawlerIndexer\Command\PipelineCommand:
        arguments:
            $indexerConfigurationLoader: '@atoolo_search.indexer.configuration_loader'

    # Run in Customer Projekt
    Atoolo\CrawlerIndexer\Messenger\Schedule:
        arguments:
            $schedule: "%atoolo.crawler.schedule%"

    Atoolo\CrawlerIndexer\Messenger\StartPipelineMessageHandler:
        arguments:
            $indexerConfigurationLoader: '@atoolo_search.indexer.configuration_loader'

    # Assembles the per-run pipeline graph around an immutable PipelineConfig.
    # $indexService/$progressHandler gehören eigentlich ins Kunden-FEDS bzw. Commons-FEDS
    Atoolo\CrawlerIndexer\Pipeline\CrawlerPipelineFactory:
        arguments:
            $indexService: "@atoolo_search.indexer.solr_index_service"
            $progressHandler: "@atoolo_search.indexer.internal_resource_progress_state"
            $denyEndings: "%atoolo.crawler.deny_endings%"
            $retryStatusCodes: "%atoolo.crawler.retry_status_codes%"