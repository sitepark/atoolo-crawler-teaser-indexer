# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    env(DEFAULT_URI): 'https://localhost'
services:
    _defaults:
        autowire: true # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
    _instanceof:
        Symfony\Component\Console\Command\Command:
            tags: ["command"]

    Atoolo\CrawlerIndexer\:
        resource: "../src/"

    # Run in Development
    Atoolo\CrawlerIndexer\Command\IndexCommand:
        arguments:
            $indexerConfigurationLoader: '@atoolo_search.indexer.configuration_loader'

    # Run in Customer Projekt
    Atoolo\CrawlerIndexer\Messenger\Schedule:
        arguments:
            $schedule: "%atoolo.crawler.schedule%"

    Atoolo\CrawlerIndexer\Messenger\StartCrawlerMessageHandler:
        arguments:
            $indexerConfigurationLoader: '@atoolo_search.indexer.configuration_loader'

    Atoolo\CrawlerIndexer\Ports\RequestExecutor:
        arguments:
            $retryStatusCodes: "%atoolo.crawler.retry_status_codes%"

    Atoolo\CrawlerIndexer\Pipeline\CrawlerPipeline:
        arguments:
            $urlCollector: '@Atoolo\CrawlerIndexer\Pipeline\Collector\URLCollector'
            $fetcher: '@Atoolo\CrawlerIndexer\Pipeline\Fetcher\Fetcher'
            $processor: '@Atoolo\CrawlerIndexer\Pipeline\Processor\Processor'
            $logger: "@logger"
            $indexer: '@Atoolo\CrawlerIndexer\Pipeline\Indexer\Indexer'

    Atoolo\CrawlerIndexer\Ports\RequestExecutorInterface: '@Atoolo\CrawlerIndexer\Ports\RequestExecutor'

    # gehört eigentlich ins Kunden-FEDS bzw. Commons-FEDS
    Atoolo\CrawlerIndexer\Pipeline\Indexer\Indexer:
        arguments:
            $indexService: "@atoolo_search.indexer.solr_index_service"
            $progressHandler: "@atoolo_search.indexer.internal_resource_progress_state"

    Atoolo\CrawlerIndexer\Pipeline\Collector\URLNormalizer:
        arguments:
            $denyEndings: "%atoolo.crawler.deny_endings%"